# Jekyll configuration for the mcp-servers catalogue site.
#
# This file is intentionally NOT regenerated by scripts/build-catalogue.mjs.
# It is a human-review surface — any change to which paths get published, or
# to the kramdown render settings, must be visible in a PR diff so a reviewer
# can catch allowlist weakening.
title: mcp-servers catalogue
description: Source-available MCP servers by Mindstone — machine-readable index.
url: https://mindstone.github.io
baseurl: /mcp-servers
theme: jekyll-theme-minimal
markdown: kramdown
permalink: /:path/:basename:output_ext

# Defense in depth — disables custom plugins, symbolic links, and includes
# from outside the source directory. Not a substitute for sanitising
# PR-controlled content in scripts/build-catalogue.mjs, but raises the bar
# for any future plugin-based escalation.
safe: true

# Allowlist: only these paths are published. Everything else under docs/ stays
# in-repo (and browseable on github.com) but is NOT served by GitHub Pages.
# This is deliberate — docs/ contains internal release-operations runbooks
# (PUBLISH_APPROVAL_PROCESS.md, EMERGENCY_REVOKE.md, plans/), security audits,
# and a Jekyll-incompatible JSON schema that must not appear on the public site.
exclude:
  - '*'
  - '*/'

include:
  - index.md
  - catalogue
  - assets
