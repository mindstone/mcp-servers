name: Publish

on:
  push:
    tags: ['*-v*']

# Two-job design (post FOX-3319 audit, P0 R1+R2 + R12 from HN-thread review):
#
#   build    — does everything that needs to touch user code: install,
#              build, test, audit, SBOM, pack-scan. Has NO publish
#              credentials and NO id-token. If a compromised dependency
#              or build tool executes here, the worst it can do is ship
#              a poisoned dist/ to the artifact store *for the next job
#              to refuse*. It has no OIDC token to mint and no
#              NPM_TOKEN to exfiltrate.
#
#   publish  — does ONLY `npm publish --ignore-scripts --provenance`.
#              Does NOT install dependencies. Does NOT invoke tsc /
#              shx / vitest / cyclonedx-npm or any other JS code beyond
#              `npm publish` itself. The tarball comes from the build
#              job via actions/upload-artifact (run-scoped,
#              integrity-guaranteed by GitHub; NOT actions/cache, which
#              is the TanStack poisoning vector). Compile-time RCE in
#              the build job therefore cannot mint the OIDC token here
#              — the publish job has no JS runtime hook to hijack.
#
# Cache poisoning is structurally absent: we do not use actions/cache at all.
# Artifacts in actions/upload-artifact are scoped per-run and cannot cross
# between unprotected and protected refs (unlike GHA cache).

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      connector: ${{ steps.meta.outputs.connector }}
      package: ${{ steps.meta.outputs.package }}
      version: ${{ steps.meta.outputs.version }}
      pack_filename: ${{ steps.pack.outputs.pack_filename }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Extract connector and version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          CONNECTOR="${TAG%-v*}"
          VERSION="${TAG##*-v}"

          if [ ! -d "connectors/$CONNECTOR" ]; then
            echo "ERROR: connectors/$CONNECTOR directory does not exist"
            exit 1
          fi

          # Reject any connector slug that isn't a plain [a-z0-9-]+ token.
          # Defence-in-depth: tag-name shell metacharacters can't reach
          # downstream `working-directory:` substitution this way.
          if ! [[ "$CONNECTOR" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "ERROR: connector slug '$CONNECTOR' contains invalid characters"
            exit 1
          fi

          NPM_PACKAGE=$(node -p "require('./connectors/$CONNECTOR/package.json').name")

          # R15: assert the npm package name matches the expected
          # @mindstone-engineering/mcp-server-<connector> pattern. Without
          # this, a malicious PR that renames package.json.name to a
          # sibling already-trusted package can hijack publishing under
          # the wrong identity (npm trusted publisher binds workflow ->
          # package, not connector slug -> package).
          EXPECTED="@mindstone-engineering/mcp-server-${CONNECTOR}"
          if [ "$NPM_PACKAGE" != "$EXPECTED" ]; then
            echo "ERROR: package.json.name '$NPM_PACKAGE' does not match expected '$EXPECTED'"
            echo "       Refusing to publish to an unexpected package name."
            exit 1
          fi

          {
            echo "connector=$CONNECTOR"
            echo "version=$VERSION"
            echo "package=$NPM_PACKAGE"
          } >> "$GITHUB_OUTPUT"
          echo "Connector: $CONNECTOR"
          echo "Version: $VERSION"
          echo "Package: $NPM_PACKAGE"

      - name: Verify tag is on main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: Release tags must reference a commit on main"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13'

      # min-release-age requires npm 11.10+. Node 22 LTS pre-22.18 ships
      # with npm 10.x. Force-install npm 11.x so the .npmrc-pinned
      # min-release-age=7 is honoured.
      - name: Upgrade npm for min-release-age support
        run: |
          npm install -g npm@^11.10.0
          npm --version

      - name: Install, build, test, audit
        working-directory: connectors/${{ steps.meta.outputs.connector }}
        env:
          # FOX-3319 R14: 7-day release-age cool-down at publish time only.
          # Set via env (not repo .npmrc) so PR CI is not affected by
          # recently-merged lockfile bumps — only release tags must clear
          # the cool-down. Maintainer can override per-tag by un-setting
          # this variable, but the override is loud in the workflow log.
          NPM_CONFIG_MIN_RELEASE_AGE: '7'
        run: |
          npm ci
          npm run build
          npm test
          npm audit --audit-level=high --omit=dev
          # Audit dev deps too — typescript / shx / vitest run at build/test
          # time. A compromised build tool poisons the published dist/.
          # Non-fatal here (devDeps audit can be noisy on transitive
          # vulnerabilities that don't affect the publish artefact) but
          # surfaced so reviewers see CVE bumps.
          npm audit --audit-level=high || true

      - name: Verify version sync (tag, package.json, server.ts)
        working-directory: connectors/${{ steps.meta.outputs.connector }}
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag ($TAG_VERSION) != package.json ($PKG_VERSION)"
            exit 1
          fi
          if [ -f "src/server.ts" ]; then
            SRV_VERSION=$(grep -oP "version:\s*'\K[^']+" src/server.ts || true)
            if [ -n "$SRV_VERSION" ] && [ "$TAG_VERSION" != "$SRV_VERSION" ]; then
              echo "ERROR: Tag ($TAG_VERSION) != server.ts ($SRV_VERSION)"
              exit 1
            fi
          fi

      - name: Verify CHANGELOG.md mentions this version
        working-directory: connectors/${{ steps.meta.outputs.connector }}
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "ERROR: CHANGELOG.md is required for publish (per security-review process gate)"
            exit 1
          fi
          if ! grep -q "\[${TAG_VERSION}\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md does not contain a [${TAG_VERSION}] entry"
            exit 1
          fi

      - name: Generate CycloneDX SBOM
        working-directory: connectors/${{ steps.meta.outputs.connector }}
        # Generates a CycloneDX 1.5 SBOM enumerating production dependencies
        # and their resolved versions/integrity hashes. Pinned to an exact
        # version (no caret, no latest) per supply-chain hygiene. Excludes
        # devDependencies — only the runtime closure ships with the package.
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@2.0.0 \
            --omit dev \
            --spec-version 1.5 \
            --output-format JSON \
            --output-file sbom.cdx.json
          echo "SBOM components:"
          node -e "const s=require('./sbom.cdx.json'); console.log('  count=' + (s.components||[]).length); console.log('  format=' + s.bomFormat + ' v' + s.specVersion);"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ${{ steps.meta.outputs.connector }}-${{ steps.meta.outputs.version }}-sbom
          path: connectors/${{ steps.meta.outputs.connector }}/sbom.cdx.json
          retention-days: 365
          if-no-files-found: error

      # Pack the tarball deterministically here in the build job. The publish
      # job will run `npm publish <tarball>` — it never re-invokes the build
      # toolchain. This is what breaks compile-time RCE → OIDC-token-mint:
      # there is no `tsc` / `shx` / `node ./scripts/*.js` in the publish job.
      - name: Pack tarball
        id: pack
        working-directory: connectors/${{ steps.meta.outputs.connector }}
        run: |
          npm pack --ignore-scripts
          TARBALL=$(find . -maxdepth 1 -name '*.tgz' -printf '%T@ %f\n' \
            | sort -nr | head -n1 | awk '{print $2}')
          if [ -z "$TARBALL" ]; then
            echo "ERROR: npm pack produced no tarball"
            exit 1
          fi
          echo "pack_filename=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Tarball: $TARBALL"
          # Reject source maps & test files in the tarball.
          tar -tzf "$TARBALL" | tee /tmp/pack-listing.txt
          if grep -qE '\.map$' /tmp/pack-listing.txt; then
            echo "ERROR: Source maps found in tarball"
            exit 1
          fi
          if grep -qE '(/__tests__/|\.test\.)' /tmp/pack-listing.txt; then
            echo "ERROR: Test files found in tarball"
            exit 1
          fi

      - name: Upload tarball artefact for publish job
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: npm-tarball
          path: connectors/${{ steps.meta.outputs.connector }}/${{ steps.pack.outputs.pack_filename }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      connector: ${{ needs.build.outputs.connector }}
      package: ${{ needs.build.outputs.package }}
      version: ${{ needs.build.outputs.version }}
    steps:
      # NO actions/checkout. NO npm ci. NO build. NO test. This job runs
      # exactly two things: setup-node (no install hooks) and `npm publish`.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13'
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted-publisher CLI support
        run: |
          npm install -g npm@^11.10.0
          npm --version

      - name: Download tarball artefact from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: /tmp/publish/

      # Trusted publishing via OIDC. Requires npm-side configuration:
      #   1. Org/package on npm has Trusted Publisher configured for this
      #      repo + workflow path (.github/workflows/publish.yml) + this
      #      environment (npm-publish).
      #   2. NO legacy NPM_TOKEN is needed in the env block.
      #
      # --provenance writes an attestation that consumers can verify with
      #   `npm view <pkg> --json` (look for dist.attestations).
      #
      # --ignore-scripts is belt-and-braces: this tarball was already packed
      #   with --ignore-scripts in the build job, and `npm publish <tarball>`
      #   does not execute lifecycle scripts at all (only `npm publish .`
      #   does). The flag is kept to document intent and survive any future
      #   `npm publish .` regression.
      - name: Publish to npm (OIDC + provenance)
        env:
          TARBALL: /tmp/publish/${{ needs.build.outputs.pack_filename }}
          # Belt-and-braces: provenance is automatic with id-token: write
          # and trusted publishing, but a malicious package.json /
          # .npmrc could try to opt out via NPM_CONFIG_PROVENANCE=false.
          # We force it on at the workflow level so neither the repo
          # config nor a malicious dep can disable it.
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          if [ ! -f "$TARBALL" ]; then
            echo "ERROR: tarball $TARBALL not found"
            ls -la /tmp/publish/
            exit 1
          fi
          npm publish "$TARBALL" --access public --provenance --ignore-scripts

  # Catalog-sync dispatch runs on a separate runner with NO publish creds and
  # NO id-token. Pinned to an immutable commit SHA. Token MUST be a
  # fine-grained PAT or GitHub App install token scoped to
  # repository_dispatch on MindstoneRebel ONLY (FOX-3319 R9).
  dispatch-catalog-sync:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch catalog sync to MindstoneRebel
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.CATALOG_SYNC_TOKEN }}
          repository: mindstone-engineering/MindstoneRebel
          event-type: connector-published
          client-payload: |-
            {
              "connector": "${{ needs.publish.outputs.connector }}",
              "package": "${{ needs.publish.outputs.package }}",
              "version": "${{ needs.publish.outputs.version }}",
              "sha": "${{ github.sha }}"
            }
