name: Publish

on:
  push:
    tags: ['zendesk-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: connectors/zendesk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag is on main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: Release tags must reference a commit on main"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify version sync (tag, package.json, server.ts)
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#zendesk-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          SRV_VERSION=$(grep -oP "version:\s*'\K[^']+" src/server.ts)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag ($TAG_VERSION) != package.json ($PKG_VERSION)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$SRV_VERSION" ]; then
            echo "ERROR: Tag ($TAG_VERSION) != server.ts ($SRV_VERSION)"
            exit 1
          fi
      - name: Verify package contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack-output.txt
          if grep -q '\.map' /tmp/pack-output.txt; then
            echo "ERROR: Source maps found in package"
            exit 1
          fi
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
