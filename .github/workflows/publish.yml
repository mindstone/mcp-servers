name: Publish

on:
  push:
    tags: ['*-v*']

# Two-job design (post FOX-3319 audit, P0 R1+R2):
#   build    — installs and builds inside an environment that has NO publish
#              credentials. Lifecycle scripts (postinstall/prepare) cannot
#              exfiltrate NPM_TOKEN because there is no NPM_TOKEN here.
#              `dist/` is handed off to publish via the implicit checkout in
#              that job re-installing with --ignore-scripts.
#   publish  — runs `npm publish` with --ignore-scripts and OIDC trusted
#              publishing (id-token: write scoped to this job ONLY). No
#              lifecycle scripts execute in this job at all.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the workflow must mint an OIDC token
      # that npm verifies against Sigstore to produce a signed attestation
      # linking the published tarball to this repo + tag + commit.
      id-token: write
    outputs:
      connector: ${{ steps.meta.outputs.connector }}
      package: ${{ steps.meta.outputs.package }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Extract connector and version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          CONNECTOR="${TAG%-v*}"
          VERSION="${TAG##*-v}"

          if [ ! -d "connectors/$CONNECTOR" ]; then
            echo "ERROR: connectors/$CONNECTOR directory does not exist"
            exit 1
          fi

          NPM_PACKAGE=$(node -p "require('./connectors/$CONNECTOR/package.json').name")

          {
            echo "connector=$CONNECTOR"
            echo "version=$VERSION"
            echo "package=$NPM_PACKAGE"
          } >> "$GITHUB_OUTPUT"
          echo "Connector: $CONNECTOR"
          echo "Version: $VERSION"
          echo "Package: $NPM_PACKAGE"

      - name: Verify tag is on main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: Release tags must reference a commit on main"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install, build, test, audit
        working-directory: connectors/${{ steps.meta.outputs.connector }}
        run: |
          npm ci
          npm run build
          npm test
          npm audit --audit-level=high --omit=dev

      - name: Verify version sync (tag, package.json, server.ts)
        working-directory: connectors/${{ steps.meta.outputs.connector }}
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag ($TAG_VERSION) != package.json ($PKG_VERSION)"
            exit 1
          fi
          if [ -f "src/server.ts" ]; then
            SRV_VERSION=$(grep -oP "version:\s*'\K[^']+" src/server.ts || true)
            if [ -n "$SRV_VERSION" ] && [ "$TAG_VERSION" != "$SRV_VERSION" ]; then
              echo "ERROR: Tag ($TAG_VERSION) != server.ts ($SRV_VERSION)"
              exit 1
            fi
          fi

      - name: Verify package contents
        working-directory: connectors/${{ steps.meta.outputs.connector }}
        run: |
          npm pack --dry-run --ignore-scripts 2>&1 | tee /tmp/pack-output.txt
          if grep -q '\.map' /tmp/pack-output.txt; then
            echo "ERROR: Source maps found in package"
            exit 1
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      connector: ${{ needs.build.outputs.connector }}
      package: ${{ needs.build.outputs.package }}
      version: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # --ignore-scripts is the load-bearing flag: no lifecycle hooks run with
      # the publish-job environment in scope. The build job above already ran
      # tests and verified the artefact; we trust the source tree at the same
      # SHA and just rebuild the compiled output here without executing any
      # third-party install hooks.
      - name: Install (no scripts) and build
        working-directory: connectors/${{ needs.build.outputs.connector }}
        run: |
          npm ci --ignore-scripts
          npx --no-install tsc
          npx --no-install shx chmod +x dist/index.js || true

      # Trusted publishing via OIDC. Requires npm-side configuration:
      #   1. Org/package on npm has Trusted Publisher configured for this
      #      repo + workflow path.
      #   2. NO legacy NPM_TOKEN is needed in the env block.
      # --provenance writes an attestation that consumers can verify with
      #   `npm view <pkg> --json` (look for dist.attestations).
      - name: Publish to npm (OIDC + provenance)
        working-directory: connectors/${{ needs.build.outputs.connector }}
        run: npm publish --access public --provenance --ignore-scripts

  # Catalog-sync dispatch runs on a separate runner with NO publish creds and
  # NO id-token. Pinned to an immutable commit SHA. Token is a fine-grained
  # PAT (or GitHub App install token) scoped to repository_dispatch on
  # MindstoneRebel ONLY.
  dispatch-catalog-sync:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch catalog sync to MindstoneRebel
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.CATALOG_SYNC_TOKEN }}
          repository: mindstone-engineering/MindstoneRebel
          event-type: connector-published
          client-payload: |-
            {
              "connector": "${{ needs.publish.outputs.connector }}",
              "package": "${{ needs.publish.outputs.package }}",
              "version": "${{ needs.publish.outputs.version }}",
              "sha": "${{ github.sha }}"
            }
