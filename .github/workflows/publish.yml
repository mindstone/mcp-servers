name: Publish

on:
  push:
    tags: ['*-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the workflow must mint an OIDC token
      # that npm verifies against Sigstore to produce a signed attestation
      # linking the published tarball to this repo + tag + commit.
      id-token: write
    outputs:
      connector: ${{ steps.meta.outputs.connector }}
      package: ${{ steps.meta.outputs.package }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract connector and version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Extract connector slug: everything before the last '-v'
          CONNECTOR="${TAG%-v*}"
          # Extract version: everything after the last '-v'
          VERSION="${TAG##*-v}"

          if [ ! -d "connectors/$CONNECTOR" ]; then
            echo "ERROR: connectors/$CONNECTOR directory does not exist"
            exit 1
          fi

          NPM_PACKAGE=$(node -p "require('./connectors/$CONNECTOR/package.json').name")

          {
            echo "connector=$CONNECTOR"
            echo "version=$VERSION"
            echo "package=$NPM_PACKAGE"
          } >> "$GITHUB_OUTPUT"
          echo "Connector: $CONNECTOR"
          echo "Version: $VERSION"
          echo "Package: $NPM_PACKAGE"

      - name: Verify tag is on main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: Release tags must reference a commit on main"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install, build, and test
        working-directory: connectors/${{ steps.meta.outputs.connector }}
        run: |
          npm ci
          npm run build
          npm test

      - name: Verify version sync (tag, package.json, server.ts)
        working-directory: connectors/${{ steps.meta.outputs.connector }}
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag ($TAG_VERSION) != package.json ($PKG_VERSION)"
            exit 1
          fi
          # Check server.ts version if the file exists
          if [ -f "src/server.ts" ]; then
            SRV_VERSION=$(grep -oP "version:\s*'\K[^']+" src/server.ts || true)
            if [ -n "$SRV_VERSION" ] && [ "$TAG_VERSION" != "$SRV_VERSION" ]; then
              echo "ERROR: Tag ($TAG_VERSION) != server.ts ($SRV_VERSION)"
              exit 1
            fi
          fi

      - name: Verify package contents
        working-directory: connectors/${{ steps.meta.outputs.connector }}
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack-output.txt
          if grep -q '\.map' /tmp/pack-output.txt; then
            echo "ERROR: Source maps found in package"
            exit 1
          fi

      - name: Generate CycloneDX SBOM
        working-directory: connectors/${{ steps.meta.outputs.connector }}
        # Generates a CycloneDX 1.5 SBOM enumerating production dependencies
        # and their resolved versions/integrity hashes. Pinned to an exact
        # version (no caret, no latest) per supply-chain hygiene. Excludes
        # devDependencies — only the runtime closure ships with the package.
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@2.0.0 \
            --omit dev \
            --spec-version 1.5 \
            --output-format JSON \
            --output-file sbom.cdx.json
          echo "SBOM components:"
          node -e "const s=require('./sbom.cdx.json'); console.log('  count=' + (s.components||[]).length); console.log('  format=' + s.bomFormat + ' v' + s.specVersion);"

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.connector }}-${{ steps.meta.outputs.version }}-sbom
          path: connectors/${{ steps.meta.outputs.connector }}/sbom.cdx.json
          retention-days: 365
          if-no-files-found: error

      - name: Verify CHANGELOG.md mentions this version
        working-directory: connectors/${{ steps.meta.outputs.connector }}
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "ERROR: CHANGELOG.md is required for publish (per security-review process gate)"
            exit 1
          fi
          if ! grep -q "\[${TAG_VERSION}\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md does not contain a [${TAG_VERSION}] entry"
            exit 1
          fi

      - name: Publish to npm with provenance
        working-directory: connectors/${{ steps.meta.outputs.connector }}
        # --provenance produces a Sigstore-signed attestation linking the
        # published tarball to this exact workflow run, repo, ref, and commit.
        # Requires id-token: write permission (granted at job level above)
        # and an npm token of type "automation" (publish-only, no 2FA prompt).
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Catalog-sync dispatch runs on a separate runner with NO NPM_TOKEN and NO
  # ~/.npmrc (we do not call setup-node here), so the third-party action below
  # cannot read the npm publish credentials. Pinned to an immutable commit SHA.
  dispatch-catalog-sync:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch catalog sync to MindstoneRebel
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.CATALOG_SYNC_TOKEN }}
          repository: mindstone/MindstoneRebel
          event-type: connector-published
          client-payload: |-
            {
              "connector": "${{ needs.publish.outputs.connector }}",
              "package": "${{ needs.publish.outputs.package }}",
              "version": "${{ needs.publish.outputs.version }}",
              "sha": "${{ github.sha }}"
            }
