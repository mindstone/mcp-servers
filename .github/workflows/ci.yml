name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        connector: [zendesk, fathom, humaans, kling, mixmax, pandadoc, servicenow, freshdesk, gamma, napkin, elevenlabs, nano-banana, runway, talentlms, workday, quickbooks, email-imap, retell-ai]
        node-version: [20, 22]
    defaults:
      run:
        working-directory: connectors/${{ matrix.connector }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run build
      - run: npm test
      - name: Verify package contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack-output.txt
          if grep -q '\.map' /tmp/pack-output.txt; then
            echo "ERROR: Source maps found in package"
            exit 1
          fi
          if grep -q '__tests__\|\.test\.' /tmp/pack-output.txt; then
            echo "ERROR: Test files found in package"
            exit 1
          fi

  notify-failure:
    name: Slack CI Failure
    needs: [build-and-test]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)

          curl -sS -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg text ":red_circle: *mcp-servers CI failed* on \`${{ github.ref_name }}\` (<${RUN_URL}|view run>)
          Commit: \`${SHORT_SHA}\` by ${{ github.actor }}
          ${COMMIT_MSG}" \
              '{text: $text}')"
