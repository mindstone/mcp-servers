name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        connector: [zendesk, fathom, humaans, kling, mixmax, office, openai-image, pandadoc, servicenow, freshdesk, gamma, napkin, elevenlabs, nano-banana, runway, talentlms, workday, quickbooks, email-imap, retell-ai, browser-automation, outreach, salesforce, apple-shortcuts, google-analytics]
        node-version: [20, 22]
    defaults:
      run:
        working-directory: connectors/${{ matrix.connector }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run build
      - run: npm test
      - name: Verify package contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack-output.txt
          if grep -q '\.map' /tmp/pack-output.txt; then
            echo "ERROR: Source maps found in package"
            exit 1
          fi
          if grep -q '__tests__\|\.test\.' /tmp/pack-output.txt; then
            echo "ERROR: Test files found in package"
            exit 1
          fi

  notify-failure:
    name: Slack CI Failure
    needs: [build-and-test]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_ACTOR: ${{ github.actor }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured — skipping notification"
            exit 0
          fi

          RUN_URL="https://github.com/$GH_REPOSITORY/actions/runs/$GH_RUN_ID"
          SHORT_SHA="${GH_SHA:0:7}"
          COMMIT_MSG=$(printf '%s\n' "$HEAD_COMMIT_MESSAGE" | head -1)

          payload="$(jq -n \
            --arg ref "$GH_REF_NAME" \
            --arg run_url "$RUN_URL" \
            --arg sha "$SHORT_SHA" \
            --arg actor "$GH_ACTOR" \
            --arg msg "$COMMIT_MSG" \
            '{text: (":red_circle: *mcp-servers CI failed* on `" + $ref + "` (<" + $run_url + "|view run>)\nCommit: `" + $sha + "` by " + $actor + "\n" + $msg)}')"

          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"
