name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        connector: [zendesk, fathom, humaans, kling, mixmax, office, openai-image, pandadoc, servicenow, freshdesk, gamma, napkin, elevenlabs, nano-banana, runway, talentlms, workday, quickbooks, email-imap, retell-ai, browser-automation, outreach, salesforce, apple-shortcuts, google-analytics, opus-video-clip]
        node-version: [20, 22]
    defaults:
      run:
        working-directory: connectors/${{ matrix.connector }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --ignore-scripts
      # NOTE: high-severity dependency-audit gate intentionally NOT run here.
      # `npm audit` queries the live advisory DB at run time, so it fires on
      # every push regardless of whether the commit changed anything — a newly
      # published upstream advisory reddens `main` on the next unrelated push
      # (misattributed to whoever pushed). The high-severity audit now runs
      # weekly via MindstoneRebel docs/project/WEEKLY_AUTOMATED_REVIEW.md and at
      # publish per docs/PUBLISH_APPROVAL_PROCESS.md. See docs/security/
      # AUDIT_FOX-3319_tanstack_supply_chain.md F7 for the publish-time gap.
      - run: npm run build
      - run: npm test
      - name: Verify package contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack-output.txt
          if grep -q '\.map' /tmp/pack-output.txt; then
            echo "ERROR: Source maps found in package"
            exit 1
          fi
          if grep -q '__tests__\|\.test\.' /tmp/pack-output.txt; then
            echo "ERROR: Test files found in package"
            exit 1
          fi

  discover-connectors:
    name: Discover connectors for status-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      connectors: ${{ steps.list.outputs.connectors }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: list
        name: List eligible connector directories
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Auto-discover every directory under connectors/. Four exclusions:
          #
          #   _template              starter scaffolding; placeholders fail validation by design.
          #   google-workspace       Tools register from a nested `definitions/` directory, which
          #                          the heuristic in scripts/check-status.mjs does not recurse
          #                          into. Remove once the script's tool-count detection learns
          #                          the new pattern (or the connector migrates to direct
          #                          registerTool calls).
          #   microsoft-sharepoint   Tools register from an array via a single loop plus one
          #                          standalone auth-tool registration; the heuristic counts
          #                          two registerTool calls but the actual surface is 36 tools.
          #                          Remove once the heuristic learns this pattern.
          #   xero                   Tools register via a `server.tool(...)` factory iterating a
          #                          tool-list array (src/tools/tool-factory.ts); the heuristic
          #                          recognises neither registerTool() nor the definitions/tools.ts
          #                          `name:` pattern, so it counts 0 against ~40 real tools. A
          #                          generated STATUS.json would have to claim 0 tools to pass —
          #                          editorially false — so xero stays catalogue-"pending" (no
          #                          STATUS.json) until the heuristic learns this pattern.
          all=()
          for d in connectors/*/; do
            name="${d#connectors/}"
            name="${name%/}"
            case "$name" in
              _template|google-workspace|microsoft-sharepoint|xero) continue ;;
            esac
            # Hard slug allowlist. Bash regex (not `grep`) so the match is
            # whole-string anchored against the full literal name — a value
            # containing an embedded newline cannot satisfy it on one line and
            # smuggle anything through on subsequent lines. Length-capped at
            # 64 chars to prevent a single PR from inflating the matrix.
            # Matches the same shape as .github/workflows/changelog-check.yml.
            if [[ ! "$name" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
              echo "::error::connector '$name' does not match slug pattern; refusing to include in matrix"
              exit 1
            fi
            all+=("$name")
          done

          if [ "${#all[@]}" -eq 0 ]; then
            echo "::error::no connectors discovered under connectors/"
            exit 1
          fi

          json=$(printf '%s\n' "${all[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "connectors=$json" >> "$GITHUB_OUTPUT"
          echo "Discovered ${#all[@]} connectors: ${all[*]}"

  status-check:
    name: STATUS.json drift check
    needs: discover-connectors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        connector: ${{ fromJSON(needs.discover-connectors.outputs.connectors) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Verify STATUS.json against package.json, server.json, src/
        # CONNECTOR is sourced from the matrix (and the matrix is sourced from
        # the discover-connectors slug-validated list); passing it as an env
        # var rather than interpolating ${{ matrix.connector }} directly into
        # the shell command means that even if the slug guard is ever relaxed,
        # a hostile name cannot break out of the argv quoting.
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: node scripts/check-status.mjs "$CONNECTOR"

  discover-connectors-untrusted:
    name: Discover connectors for untrusted-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      connectors: ${{ steps.list.outputs.connectors }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: list
        name: List connector directories for the untrusted-content gate
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The untrusted-content coverage ratchet must run for EVERY connector
          # so a baselined gap can never be fixed-but-still-baselined without CI
          # nagging. We therefore exclude ONLY `_template` (starter scaffolding) —
          # we intentionally do NOT inherit status-check's google-workspace /
          # microsoft-sharepoint / xero exclusions, which exist purely for an
          # unrelated STATUS.json tool-count heuristic. microsoft-sharepoint and
          # xero are baselined gaps; if they were skipped here, the ratchet could
          # never detect them being remediated.
          all=()
          for d in connectors/*/; do
            name="${d#connectors/}"
            name="${name%/}"
            case "$name" in
              _template) continue ;;
            esac
            # Hard slug allowlist — same anchored, length-capped guard as
            # discover-connectors, so a hostile directory name cannot smuggle
            # shell metacharacters into the matrix.
            if [[ ! "$name" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
              echo "::error::connector '$name' does not match slug pattern; refusing to include in matrix"
              exit 1
            fi
            all+=("$name")
          done

          if [ "${#all[@]}" -eq 0 ]; then
            echo "::error::no connectors discovered under connectors/"
            exit 1
          fi

          json=$(printf '%s\n' "${all[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "connectors=$json" >> "$GITHUB_OUTPUT"
          echo "Discovered ${#all[@]} connectors for untrusted-coverage: ${all[*]}"

  untrusted-coverage-selftest:
    name: Untrusted-coverage gate self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Prove the gate fails the "fetch + unused helper + raw result" shape
        # Synthetic-fixture regression proof for the F1 false-pass (a vendored
        # untrusted-content helper file must NOT self-satisfy the envelope scan).
        run: node scripts/check-untrusted-coverage.mjs --self-test

  untrusted-coverage-check:
    name: Untrusted-content envelope coverage
    needs: discover-connectors-untrusted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        connector: ${{ fromJSON(needs.discover-connectors-untrusted.outputs.connectors) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Verify external text reaches the untrusted-content envelope (AGENTS.md invariant #6)
        # ATTENTION-FORCING gate, not proof: see scripts/check-untrusted-coverage.mjs
        # header. CONNECTOR is sourced from the slug-validated discover-connectors
        # list and passed as an env var (never interpolated into the shell command)
        # so a hostile name cannot break out of argv quoting — same hardening as
        # the status-check job.
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: node scripts/check-untrusted-coverage.mjs "$CONNECTOR"

  catalogue-check:
    name: Catalogue is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Check committed docs/ catalogue matches generator output
        run: node scripts/build-catalogue.mjs --check

  install-links-check:
    name: One-click install blocks match server.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Check connector READMEs match install-links generator output
        run: node scripts/gen-install-links.mjs --check

  release-hygiene-selftest:
    name: Release-hygiene gate self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Prove release-hygiene detections fire on synthetic fixtures
        run: node scripts/check-release-hygiene.mjs --self-test

  release-hygiene-check:
    name: Release hygiene (shared packages + CHANGELOG)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Verify shared-package src bumps and aging [Unreleased] debt
        run: node scripts/check-release-hygiene.mjs

  compose-app-package-check:
    name: Compose-app shared generator (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/mcp-app-compose
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts
      - name: Type-check the shared compose-app generator
        run: npm run build
      - name: Run the shared compose-app generator invariant/variant tests
        run: npm test

  discover-compose-consumers:
    name: Discover compose-template consumers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      connectors: ${{ steps.list.outputs.connectors }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: list
        name: List connectors that consume @mindstone/mcp-app-compose
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # A connector is a compose-template consumer iff its package.json
          # declares the `compose:template:check` script — the drift gate that
          # regenerates the committed template from the shared
          # @mindstone/mcp-app-compose builder and byte-compares. We AUTO-DISCOVER
          # rather than hard-code the list on purpose: the whole reason this job
          # exists is that build-and-test's hand-maintained matrix silently
          # omitted google-workspace and microsoft-mail, so a generator change (or
          # a security fix) could merge without proving every committed consumer
          # template had been regenerated. Discovery means a new consumer can
          # never be added to the repo without CI enforcing its drift gate.
          all=()
          for d in connectors/*/; do
            name="${d#connectors/}"
            name="${name%/}"
            pkg="connectors/$name/package.json"
            [ -f "$pkg" ] || continue
            if ! jq -e '.scripts["compose:template:check"]' "$pkg" >/dev/null 2>&1; then
              continue
            fi
            # Hard slug allowlist — same anchored, length-capped guard as the
            # other discover jobs, so a hostile directory name cannot smuggle
            # shell metacharacters into the matrix.
            if [[ ! "$name" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
              echo "::error::connector '$name' does not match slug pattern; refusing to include in matrix"
              exit 1
            fi
            all+=("$name")
          done

          if [ "${#all[@]}" -eq 0 ]; then
            echo "::error::no compose-template consumers discovered (expected at least google-workspace + microsoft-mail)"
            exit 1
          fi

          json=$(printf '%s\n' "${all[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "connectors=$json" >> "$GITHUB_OUTPUT"
          echo "Discovered ${#all[@]} compose consumers: ${all[*]}"

  compose-template-drift-check:
    name: Compose-template drift (generator ↔ committed template)
    needs: discover-compose-consumers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        connector: ${{ fromJSON(needs.discover-compose-consumers.outputs.connectors) }}
    defaults:
      run:
        working-directory: connectors/${{ matrix.connector }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      # --ignore-scripts is safe: the shared @mindstone/mcp-app-compose builder
      # is a file: devDependency of pure ESM source (no build step), so the
      # drift check can import it straight after install.
      - run: npm ci --ignore-scripts
      - name: Regenerate committed compose template and byte-compare
        run: npm run compose:template:check
      - name: Reject internal ticket references in the generated template
        run: npm run security:internal-refs
