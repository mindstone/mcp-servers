name: Release

# Triggered when a version-bump commit lands on main (from
# `npm run mcp:release` in mindstone-rebel-1, which drives a script-based
# version bump across package.json + package-lock.json + server.json +
# CHANGELOG.md atomically). Detects which package(s) had their version
# field bumped across the pushed range, verifies each bump carries the
# Release-Gate trailer (see below), then publishes each to npm via Trusted
# Publishing OIDC (provenance attestations + Sigstore) and to the MCP
# registry via mcp-publisher, and posts a Slack alert per publish.
#
# Release-Gate trailer: the release tooling stamps every release commit with
#   Release-Gate: docs-private/reports/security-reviews/<file>.md#<sha256>
# pointing at the (private, Rebel-side) security-review artifact and its
# content hash. This workflow validates the trailer's FORMAT ONLY — this is
# a public repo: no secrets, no private-repo lookups, no network calls for
# the gate. The path+hash are audited against the actual artifact on the
# Rebel side. A bump whose attributed commit lacks a valid trailer is NOT
# published and the detect job fails loudly. This is an accident/consistency
# gate, not adversarial security — that layer remains Trusted Publishing +
# Sigstore provenance + min-release-age.
#
# Publishes any existing connector whose package version is bumped. Brand-new
# packages still require a manual first publish before this workflow can take
# over with Trusted Publishing (first-adds are exempt from the trailer gate).
# Version DOWNGRADES (reverts) are skipped with a log line, never published
# and never failed — reverting a refused bump must not wedge main.
#
# Source of truth for the design: docs/plans/260525_oss_release_automation.md
# (in mindstone-rebel-1); release runbook: docs/project/MCP_OSS_RELEASE_AGENT_DRIVEN.md
# (also in mindstone-rebel-1).

on:
  push:
    branches: [main]
    paths:
      - 'connectors/**/package.json'
      - 'connectors/**/scripts/**'
      - 'packages/**/package.json'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect bumped packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
      has_changes: ${{ steps.diff.outputs.has_changes }}
      meta: ${{ steps.diff.outputs.meta }}
      registry_packages: ${{ steps.diff.outputs.registry_packages }}
      has_registry_changes: ${{ steps.diff.outputs.has_registry_changes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: the detect diff runs over the pushed range
          # (event.before..sha), not HEAD~1, and per-package attribution
          # walks the range to find the commit that changed the version.
          fetch-depth: 0

      - name: Detect bumped packages and verify Release-Gate trailers
        id: diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # --- Resolve the diff base for the pushed range -------------------
          # `github.event.before` is all-zeros on a branch-create push and may
          # be unknown locally after history rewrites. Fall back to the first
          # parent of the pushed head; if that doesn't exist either
          # (single-commit history), compare against the empty tree, which
          # makes every package look first-add => exempt => no publish
          # (fail-safe: never publish off a base we can't attribute).
          EMPTY_TREE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          if [[ "${BEFORE_SHA}" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            if git rev-parse --verify --quiet "${AFTER_SHA}~1" >/dev/null; then
              BASE="$(git rev-parse "${AFTER_SHA}~1")"
              echo "before SHA unusable (${BEFORE_SHA:-<empty>}); falling back to first parent ${BASE}"
            else
              BASE="${EMPTY_TREE}"
              echo "before SHA unusable and head has no parent; treating all packages as first-add"
            fi
          else
            BASE="${BEFORE_SHA}"
          fi
          echo "Detecting bumps over range: ${BASE}..${AFTER_SHA}"

          # Trailer format (validated FORMAT-ONLY on this public repo; the
          # path+hash are audited against the real artifact on the Rebel side).
          # Each path segment must start with [A-Za-z0-9_-], which rejects
          # '..' and empty segments — defense-in-depth parity with the
          # Rebel-side parser (parseReleaseGateTrailer in mcp-release.ts).
          TRAILER_RE='^Release-Gate: docs-private/reports/security-reviews/([A-Za-z0-9_-][A-Za-z0-9._-]*/)*[A-Za-z0-9_-][A-Za-z0-9._-]*\.md#[a-f0-9]{64}$'

          changed=()
          meta_entries=()
          FAILED=0
          touched_packages=""
          # commit sha -> space-separated package names attributed to it.
          # Used to enforce "one release commit per connector" (see below).
          declare -A COMMIT_PKGS=()

          while IFS= read -r path; do
            case "${path}" in
              connectors/*/*)
                name="${path#connectors/}"
                name="${name%%/*}"
                if [ "${name}" != "_template" ]; then
                  touched_packages="${touched_packages}${name}"$'\n'
                fi
                ;;
              packages/*/*)
                name="${path#packages/}"
                name="${name%%/*}"
                if [ "${name}" != "_template" ]; then
                  touched_packages="${touched_packages}${name}"$'\n'
                fi
                ;;
            esac
          done < <(git diff --name-only "${BASE}" "${AFTER_SHA}")

          package_touched() {
            local target="$1"
            grep -Fxq "${target}" <<< "${touched_packages}"
          }

          # Returns 0 and prints nothing on success; prints errors and returns
          # 1 when the attributed commit's message lacks a valid trailer.
          require_release_gate_trailer() {
            local name="$1" version="$2" commit="$3" reason="$4"
            if [ -z "${commit}" ]; then
              echo "::error::Could not attribute ${reason} for ${name}@${version} to a commit in ${BASE}..${AFTER_SHA}"
              return 1
            fi
            if git log -1 --format=%B "${commit}" | grep -Eq "${TRAILER_RE}"; then
              echo "  Release-Gate trailer verified on ${commit} for ${name}@${version}"
              return 0
            fi
            echo "::error::Refusing to publish ${name}@${version}: commit ${commit} (${reason}) has no valid Release-Gate trailer."
            echo "::error::Releases land only via the release tooling (npm run mcp:release <connector> in mindstone-rebel-1), which stamps 'Release-Gate: docs-private/reports/security-reviews/<file>.md#<sha256>' on the release commit."
            echo "::error::This bump landed outside that path. Recovery: revert the bump on main, then rerun the proper release path. (mcp:release --reconcile is for published-but-unreconciled states, not refused bumps.) See docs/project/MCP_OSS_RELEASE_AGENT_DRIVEN.md in mindstone-rebel-1."
            return 1
          }

          # Fail loudly if the same basename exists in both families — a matrix
          # entry is a basename only, so ambiguity would pick the wrong dir.
          for dir in connectors/*/; do
            name=$(basename "${dir}")
            if [ "${name}" = "_template" ]; then
              continue
            fi
            if [ -d "packages/${name}" ]; then
              echo "::error::Ambiguous package basename ${name}: exists in both connectors/ and packages/"
              exit 1
            fi
          done

          # Scan one package family (connectors/ or packages/) for publishable bumps.
          scan_publishable_family() {
            local family="$1"
            for dir in ${family}/*/; do
              name=$(basename "${dir}")
              if [ "${name}" = "_template" ]; then
                continue
              fi
              pkg="${dir}package.json"
              [ -f "${pkg}" ] || continue

              new_version=$(jq -r '.version // ""' "${pkg}")
              old_version=$(git show "${BASE}:${pkg}" 2>/dev/null | jq -r '.version // ""' 2>/dev/null || echo "")
              package_name=$(jq -r '.name // ""' "${pkg}")

              if [ -z "${old_version}" ]; then
                echo "Skipping first-add package ${name}@${new_version} (${family}); bootstrap publishes are manual."
                continue
              fi

              if [ -n "${new_version}" ] && [ "${new_version}" != "${old_version}" ]; then
                # Downgrade/revert: skip without failing — reverting a refused
                # or bad bump must not itself wedge main with publish failures.
                highest=$(printf '%s\n%s\n' "${old_version}" "${new_version}" | sort -V | tail -1)
                if [ "${highest}" = "${old_version}" ]; then
                  echo "Skipping ${name}: version decreased ${old_version} -> ${new_version} (revert/downgrade; nothing to publish)"
                  continue
                fi

                echo "Detected version bump for ${name} (${family}): ${old_version} -> ${new_version}"

                # Attribute the bump to the commit in the range that actually
                # changed this package.json's version to the final value
                # (newest-first walk; first-parent comparison).
                attributed=""
                for sha in $(git rev-list "${BASE}..${AFTER_SHA}" -- "${pkg}"); do
                  commit_version=$(git show "${sha}:${pkg}" 2>/dev/null | jq -r '.version // ""' 2>/dev/null || echo "")
                  parent_version=$(git show "${sha}^:${pkg}" 2>/dev/null | jq -r '.version // ""' 2>/dev/null || echo "")
                  if [ "${commit_version}" = "${new_version}" ] && [ "${commit_version}" != "${parent_version}" ]; then
                    attributed="${sha}"
                    break
                  fi
                done

                if [ -n "${attributed}" ]; then
                  COMMIT_PKGS["${attributed}"]+="${name} "
                fi

                if require_release_gate_trailer "${name}" "${new_version}" "${attributed}" "version bump commit"; then
                  changed+=("${name}")
                  meta_entries+=("$(jq -nc --arg name "${name}" --arg version "${new_version}" --arg commit "${attributed}" --arg family "${family}" --arg npmName "${package_name}" '{name: $name, version: $version, commit: $commit, family: $family, npmName: $npmName}')")
                else
                  FAILED=1
                fi
              elif [ -n "${new_version}" ]; then
                if [ -n "${package_name}" ] && package_touched "${name}" && ! npm view "${package_name}@${new_version}" version >/dev/null 2>&1; then
                  echo "Detected unpublished current version for ${name} (${family}): ${package_name}@${new_version}"
                  # Same gate as the bump path: the newest commit in the range
                  # touching this package is what re-triggers the publish, so
                  # it must carry the Release-Gate trailer.
                  attributed=$(git rev-list -1 "${BASE}..${AFTER_SHA}" -- "${family}/${name}/" || echo "")
                  if [ -n "${attributed}" ]; then
                    COMMIT_PKGS["${attributed}"]+="${name} "
                  fi
                  if require_release_gate_trailer "${name}" "${new_version}" "${attributed}" "unpublished-current-version retry commit"; then
                    changed+=("${name}")
                    meta_entries+=("$(jq -nc --arg name "${name}" --arg version "${new_version}" --arg commit "${attributed}" --arg family "${family}" --arg npmName "${package_name}" '{name: $name, version: $version, commit: $commit, family: $family, npmName: $npmName}')")
                  else
                    FAILED=1
                  fi
                elif [ -n "${package_name}" ] && ! package_touched "${name}"; then
                  echo "Skipping unpublished-version check for untouched package ${name}"
                fi
              fi
            done
          }

          scan_publishable_family connectors
          scan_publishable_family packages

          # One release commit per connector: the Release-Gate trailer contract
          # is per connector/version, and public CI cannot prove that a single
          # private review artifact covers more than one package. If any
          # attributed commit maps to multiple publishable packages, fail
          # loudly — this applies to both the version-bump path and the
          # unpublished-current-version fallback above.
          if [ "${#COMMIT_PKGS[@]}" -gt 0 ]; then
            for sha in "${!COMMIT_PKGS[@]}"; do
              read -r -a pkgs <<< "${COMMIT_PKGS[${sha}]}"
              if [ "${#pkgs[@]}" -gt 1 ]; then
                echo "::error::Commit ${sha} is attributed to multiple publishable packages: ${pkgs[*]}"
                echo "::error::Multi-package release commits are not supported. Release each connector separately via the release tooling (npm run mcp:release <connector> in mindstone-rebel-1). See docs/project/MCP_OSS_RELEASE_AGENT_DRIVEN.md (mindstone-rebel-1) and docs/PUBLISH_APPROVAL_PROCESS.md."
                FAILED=1
              fi
            done
          fi

          if [ ${#changed[@]} -eq 0 ]; then
            echo "No publishable version bumps detected."
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "packages=[]" >> "${GITHUB_OUTPUT}"
            echo "meta=[]" >> "${GITHUB_OUTPUT}"
            echo "registry_packages=[]" >> "${GITHUB_OUTPUT}"
            echo "has_registry_changes=false" >> "${GITHUB_OUTPUT}"
          else
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
            json=$(printf '%s\n' "${changed[@]}" | jq -R . | jq -sc .)
            meta=$(printf '%s\n' "${meta_entries[@]}" | jq -sc .)
            registry_json=$(printf '%s\n' "${meta_entries[@]}" | jq -sc '[.[] | select(.family == "connectors") | .name]')
            has_registry=$(printf '%s\n' "${meta_entries[@]}" | jq -sc 'if ([.[] | select(.family == "connectors")] | length) > 0 then true else false end')
            echo "packages=${json}" >> "${GITHUB_OUTPUT}"
            echo "meta=${meta}" >> "${GITHUB_OUTPUT}"
            echo "registry_packages=${registry_json}" >> "${GITHUB_OUTPUT}"
            echo "has_registry_changes=${has_registry}" >> "${GITHUB_OUTPUT}"
            echo "Will publish: ${json}"
            echo "Registry publish (connectors only): ${registry_json}"
          fi

          if [ "${FAILED}" -ne 0 ]; then
            echo ""
            echo "One or more release-gate checks failed (missing/invalid Release-Gate trailer, or a multi-package release commit); failing the run."
            echo "NOTHING is published from this push (fail-closed), including any packages listed above that did pass."
            exit 1
          fi

  build:
    name: Build (${{ matrix.package }})
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.packages) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve package dir
        id: resolve
        run: |
          set -euo pipefail
          name="${{ matrix.package }}"
          if [ -d "connectors/${name}" ]; then
            if [ -d "packages/${name}" ]; then
              echo "::error::Ambiguous package basename ${name}: exists in both connectors/ and packages/"
              exit 1
            fi
            dir="connectors/${name}"
            family="connectors"
            expected_name="@mindstone/mcp-server-${name}"
          elif [ -d "packages/${name}" ]; then
            dir="packages/${name}"
            family="packages"
            expected_name="@mindstone/${name}"
          else
            echo "::error::Package ${name} not found in connectors/ or packages/"
            exit 1
          fi
          echo "dir=${dir}" >> "${GITHUB_OUTPUT}"
          echo "family=${family}" >> "${GITHUB_OUTPUT}"
          echo "expected_name=${expected_name}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${name} -> ${dir} (family=${family}, expected_name=${expected_name})"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify package.json identity
        # Belt-and-braces against publishing the wrong package from the
        # right directory: assert the package.json.name matches the
        # family-derived expected name exactly. Catches typos, copy-paste
        # errors, and malicious overlays where a release commit changed only
        # the body of a package.json without changing the directory name.
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: |
          set -euo pipefail
          expected="${{ steps.resolve.outputs.expected_name }}"
          actual=$(jq -r '.name' package.json)
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::package.json name mismatch"
            echo "  expected: ${expected}"
            echo "  actual:   ${actual}"
            exit 1
          fi
          echo "package.json name verified: ${actual}"

      - name: Install dependencies
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: npm run build --if-present

      - name: Test
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: npm test --if-present

      - name: Pack tarball
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: npm pack --ignore-scripts

      - name: Verify tarball contents match expected package
        # Extract package.json from the tarball (which is what npm publish
        # consumes) and re-check name + version. This catches the case where
        # the tarball got assembled from somewhere other than the working
        # tree (e.g. a `prepack` script — which we disable via --ignore-scripts
        # — or a future tooling change).
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: |
          set -euo pipefail
          tgz=$(ls *.tgz | head -1)
          [ -n "${tgz}" ] || { echo "::error::npm pack produced no tarball"; exit 1; }
          tar -xzOf "${tgz}" package/package.json > /tmp/tarball-pkg.json
          expected_name="${{ steps.resolve.outputs.expected_name }}"
          tar_name=$(jq -r '.name' /tmp/tarball-pkg.json)
          tar_version=$(jq -r '.version' /tmp/tarball-pkg.json)
          src_version=$(jq -r '.version' package.json)
          if [ "${tar_name}" != "${expected_name}" ]; then
            echo "::error::Tarball package.json name mismatch"
            echo "  expected: ${expected_name}"
            echo "  actual:   ${tar_name}"
            exit 1
          fi
          if [ "${tar_version}" != "${src_version}" ]; then
            echo "::error::Tarball/source version mismatch"
            echo "  source:  ${src_version}"
            echo "  tarball: ${tar_version}"
            exit 1
          fi
          echo "Tarball identity verified: ${tar_name}@${tar_version}"

      - name: Pack hygiene scan
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: |
          set -euo pipefail
          tgz=$(ls *.tgz | head -1)
          [ -n "${tgz}" ] || { echo "::error::npm pack produced no tarball"; exit 1; }
          # Reject sensitive / source-leaking files in the tarball. Expanded
          # vs the original list per the recent security review.
          forbidden=$(tar -tzf "${tgz}" | grep -E '\.map$|\.test\.|__tests__/|\.env|\.npmrc|\.yarnrc|\.git[^.]|\.pem$|\.key$|(^|/)(src|test|tests)/.*\.(ts|tsx|mts|cts)$' || true)
          if [ -n "${forbidden}" ]; then
            echo "::error::Forbidden files in tarball:"
            echo "${forbidden}"
            exit 1
          fi
          echo "Tarball clean: ${tgz}"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball-${{ matrix.package }}
          path: ${{ steps.resolve.outputs.dir }}/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: Publish to npm (${{ matrix.package }})
    needs: [detect, build]
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The npm-publish environment is part of npm's Trusted Publishing trust
    # configuration for this workflow. By design it has NO required reviewers
    # (AI-only release policy, 2026-06-11): publish approval is the
    # machine-validated gate chain — §13 security review, the Release-Gate
    # trailer check in `detect`, the Rebel-side trailer audit, and per-publish
    # Slack alerting. See docs/PUBLISH_APPROVAL_PROCESS.md and
    # docs/security/BRANCH_PROTECTION.md § npm-publish environment.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write  # Required for Trusted Publishing OIDC
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.packages) }}
    steps:
      - name: Download tarball artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tarball-${{ matrix.package }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify tarball matches expected name
        id: tarball
        run: |
          set -e
          tgz=$(ls *.tgz | head -1)
          [ -n "${tgz}" ] || { echo "::error::No tarball found"; exit 1; }
          echo "tarball=${tgz}" >> "${GITHUB_OUTPUT}"

      - name: npm publish (Trusted Publishing OIDC, no scripts)
        # No NPM_TOKEN — npm CLI uses the OIDC token from id-token: write
        # to authenticate against the package's Trusted Publisher config.
        # --provenance generates the Sigstore signature consumers verify
        # via `npm audit signatures`.
        run: |
          npm publish "${{ steps.tarball.outputs.tarball }}" \
            --access public \
            --provenance \
            --ignore-scripts

      - name: Post publish alert to Slack
        # Every npm publish ATTEMPT that got as far as having a tarball gets a
        # same-day-noticeable Slack ping — ":package: Published" on success, a
        # ":warning: Publish attempted" line when the job failed after that
        # point (deliberate: a failed attempt is as alert-worthy as a publish).
        # Payload: connector@version, the attributed release commit, the
        # actor, and the run URL. This is the publish-alerting leg of the AI-only
        # release gate chain (see docs/PUBLISH_APPROVAL_PROCESS.md) — an
        # unexpected publish should be visible to humans without anyone
        # polling npm. Reuses the SLACK_WEBHOOK_URL secret. Fail-soft if unconfigured;
        # alert failure must not fail a publish that already happened, but
        # it should be visible in the log.
        # Security: all dynamic values pass through `env:` + `jq --arg`
        # (JSON-escaped), never inline shell substitution.
        if: ${{ always() && steps.tarball.outcome == 'success' }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DETECT_META: ${{ needs.detect.outputs.meta }}
          PACKAGE: ${{ matrix.package }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL not configured — skipping publish alert"
            exit 0
          fi

          version=$(jq -r --arg n "${PACKAGE}" '.[] | select(.name == $n) | .version' <<< "${DETECT_META}")
          commit=$(jq -r --arg n "${PACKAGE}" '.[] | select(.name == $n) | .commit' <<< "${DETECT_META}")
          npmName=$(jq -r --arg n "${PACKAGE}" '.[] | select(.name == $n) | .npmName' <<< "${DETECT_META}")

          if [ "${JOB_STATUS}" = "success" ]; then
            headline=":package: Published"
          else
            headline=":warning: Publish attempted (job status: ${JOB_STATUS}) for"
          fi

          payload=$(jq -n \
            --arg headline "${headline}" \
            --arg pkg "${npmName}" \
            --arg version "${version:-unknown}" \
            --arg commit "${commit:-unknown}" \
            --arg actor "${ACTOR}" \
            --arg repo "${REPO}" \
            --arg run_url "${RUN_URL}" \
            '{text: ($headline + " *" + $pkg + "@" + $version + "* to npm\nrelease commit: <https://github.com/" + $repo + "/commit/" + $commit + "|" + $commit + "> — actor: " + $actor + "\n<" + $run_url + "|workflow run>")}')

          curl -sS -X POST "${SLACK_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "${payload}"

  publish-mcp-registry:
    name: Publish to MCP registry (${{ matrix.package }})
    needs: [detect, publish-npm]
    if: needs.detect.outputs.has_registry_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # Required for github-oidc auth on MCP registry
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.registry_packages) }}
    defaults:
      run:
        working-directory: connectors/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify server.json present
        run: |
          if [ ! -f server.json ]; then
            echo "::warning::No server.json — skipping MCP registry publish"
            exit 0
          fi
          echo "Found server.json"

      - name: Install mcp-publisher (pinned + checksum)
        env:
          # Pin to a specific mcp-publisher release. To bump:
          #   1. Pick a release from https://github.com/modelcontextprotocol/registry/releases
          #   2. Read the SHA-256 of mcp-publisher_linux_amd64.tar.gz from the assets list
          #   3. Update both MCP_PUBLISHER_VERSION and MCP_PUBLISHER_SHA256_LINUX_AMD64
          #   4. Open a PR; do not bump silently.
          # CI runs on ubuntu-latest -> linux/amd64, so we only need that one SHA.
          MCP_PUBLISHER_VERSION: v1.7.9
          MCP_PUBLISHER_SHA256_LINUX_AMD64: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          if [ "${os}" != "linux" ] || [ "${arch}" != "x86_64" ]; then
            echo "::error::release.yml only supports linux/amd64 runners; saw ${os}/${arch}"
            exit 1
          fi
          tarball="mcp-publisher_linux_amd64.tar.gz"
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${tarball}"
          curl -fsSL --output "${tarball}" "${url}"
          actual=$(sha256sum "${tarball}" | awk '{print $1}')
          expected="${MCP_PUBLISHER_SHA256_LINUX_AMD64}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::mcp-publisher checksum mismatch"
            echo "  expected: ${expected}"
            echo "  actual:   ${actual}"
            exit 1
          fi
          echo "Verified ${tarball} sha256: ${actual}"
          tar -xzf "${tarball}" -C /usr/local/bin mcp-publisher
          rm -f "${tarball}"
          mcp-publisher --version

      - name: Publish to MCP registry (github-oidc)
        run: |
          set -e
          if [ ! -f server.json ]; then
            echo "Skipping (no server.json)"
            exit 0
          fi
          mcp-publisher login github-oidc
          mcp-publisher publish
